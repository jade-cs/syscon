[package]
name = "syscon"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rocket = { version = "0.5", default-features = false, features = ["json"] }
linux-raw-sys = { version = "0.12", default-features = false, features = ["ptrace"] }
hex = { version = "0.4.3", default-features = false, features = ["alloc", "std"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.build-override]
opt-level = 3
