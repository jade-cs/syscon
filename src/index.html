<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>syscon - Container Auditor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace; background: #1a1a2e; color: #e0e0e0; display: flex; height: 100vh; }
  #sidebar { width: 280px; background: #16213e; border-right: 1px solid #0f3460; overflow-y: auto; flex-shrink: 0; }
  #sidebar h2 { padding: 16px; font-size: 14px; color: #e94560; border-bottom: 1px solid #0f3460; display: flex; justify-content: space-between; align-items: center; }
  .section-header { padding: 8px 16px; font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #0f3460; background: #121d36; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .section-header:hover { color: #e0e0e0; }
  .section-header .arrow { transition: transform 0.2s; }
  .section-header .arrow.collapsed { transform: rotate(-90deg); }
  .exp-item { padding: 10px 16px; border-bottom: 1px solid #0f3460; cursor: pointer; font-size: 12px; }
  .exp-item:hover { background: #0f3460; }
  .exp-item.active { background: #0f3460; border-left: 3px solid #e94560; }
  .exp-item .eid { color: #e94560; font-weight: bold; }
  .exp-item .stats { color: #888; font-size: 11px; margin-top: 2px; }
  .container-item { padding: 8px 16px 8px 28px; border-bottom: 1px solid #0f3460; cursor: pointer; font-size: 11px; color: #aaa; }
  .container-item:hover { background: #0f3460; color: #e0e0e0; }
  .container-item.active { background: #0f3460; color: #e94560; border-left: 3px solid #e94560; }
  .container-item .cid { color: #e94560; font-weight: bold; }
  .container-item .stats { color: #888; font-size: 10px; margin-top: 1px; }
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #tabs { display: flex; background: #16213e; border-bottom: 1px solid #0f3460; }
  .tab { padding: 10px 16px; cursor: pointer; font-size: 12px; color: #888; border-bottom: 2px solid transparent; white-space: nowrap; }
  .tab:hover { color: #e0e0e0; }
  .tab.active { color: #e94560; border-bottom-color: #e94560; }
  #content-wrapper { flex: 1; display: flex; overflow: hidden; }
  #action-sidebar { width: 220px; background: #16213e; border-right: 1px solid #0f3460; overflow-y: auto; flex-shrink: 0; }
  #action-sidebar h3 { padding: 10px 12px; font-size: 11px; color: #888; border-bottom: 1px solid #0f3460; text-transform: uppercase; letter-spacing: 0.5px; }
  .action-item { padding: 8px 12px; border-bottom: 1px solid #0f3460; cursor: pointer; font-size: 11px; color: #aaa; }
  .action-item:hover { background: #0f3460; color: #e0e0e0; }
  .action-item.active { background: #0f3460; color: #e94560; border-left: 3px solid #e94560; }
  .action-item .action-id { color: #e94560; font-weight: bold; }
  .action-item .action-cmd { color: #aaa; margin-top: 2px; word-break: break-all; }
  #content { flex: 1; overflow: hidden; position: relative; }
  #receipt-view { white-space: pre-wrap; padding: 16px; font-size: 12px; line-height: 1.6; overflow: auto; height: 100%; }
  #graph-view { width: 100%; height: 100%; background: #f8f8f8; overflow: hidden; cursor: grab; position: relative; }
  #graph-view.dragging { cursor: grabbing; }
  #graph-inner { transform-origin: 0 0; position: absolute; }
  #graph-controls { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 4px; z-index: 10; }
  #graph-controls button { width: 32px; height: 32px; background: #16213e; color: #e0e0e0; border: 1px solid #0f3460; border-radius: 4px; cursor: pointer; font-size: 16px; font-family: inherit; display: flex; align-items: center; justify-content: center; }
  #graph-controls button:hover { background: #0f3460; color: #e94560; }
  #zoom-level { color: #666; font-size: 10px; text-align: center; background: #16213e; padding: 2px; border-radius: 3px; border: 1px solid #0f3460; }
  .hidden { display: none !important; }
  #no-selection { display: flex; align-items: center; justify-content: center; height: 100%; color: #555; font-size: 14px; }
  #graph-loading { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f8f8f8; z-index: 20; }
  #graph-loading .spinner { width: 32px; height: 32px; border: 3px solid #ddd; border-top-color: #e94560; border-radius: 50%; animation: spin 0.8s linear infinite; }
  #graph-loading .label { margin-top: 12px; color: #666; font-size: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status-bar { background: #16213e; border-top: 1px solid #0f3460; padding: 6px 16px; font-size: 11px; color: #666; display: flex; justify-content: space-between; }
  .btn { background: none; border: 1px solid #0f3460; color: #888; padding: 2px 8px; cursor: pointer; font-family: inherit; font-size: 11px; border-radius: 3px; }
  .btn:hover { color: #e94560; border-color: #e94560; }
  .skipped-note { padding: 8px 16px; font-size: 11px; color: #555; border-top: 1px solid #0f3460; }
</style>
</head>
<body>

<div id="sidebar">
  <h2>SYSCON <button class="btn" onclick="refresh()">refresh</button></h2>
  <div id="sidebar-content"></div>
  <div id="skipped-note" class="skipped-note hidden"></div>
</div>

<div id="main">
  <div id="tabs">
    <div class="tab active" data-tab="receipt" onclick="switchTab('receipt')">Receipt</div>
    <div class="tab" data-tab="graph" onclick="switchTab('graph')">Graph</div>
  </div>
  <div id="content-wrapper">
    <div id="action-sidebar" class="hidden">
      <h3>Actions</h3>
      <div id="action-list"></div>
    </div>
    <div id="content">
      <div id="no-selection">Select an experiment or container</div>
      <div id="receipt-view" class="hidden"></div>
      <div id="graph-view" class="hidden">
        <div id="graph-loading" class="hidden">
          <div class="spinner"></div>
          <div class="label">Rendering graph...</div>
        </div>
        <div id="graph-inner"></div>
        <div id="graph-controls">
          <button onclick="graphZoom(1.3)" title="Zoom in">+</button>
          <button onclick="graphZoom(0.7)" title="Zoom out">-</button>
          <button onclick="graphFit()" title="Fit to view">F</button>
          <button onclick="graphReset()" title="Reset zoom">1</button>
          <div id="zoom-level">100%</div>
        </div>
      </div>
    </div>
  </div>
  <div id="status-bar">
    <span id="status-text">Ready</span>
    <span><label><input type="checkbox" id="auto-refresh-toggle"> Auto-refresh (5s)</label></span>
  </div>
</div>

<script>
// Selection state: either an experiment or a standalone container
let selectionType = null; // 'experiment' | 'container'
let selectedId = null;
let currentTab = 'receipt';
let selectedAction = null; // null = overview/snapshot
let autoRefreshTimer = null;

// Collapse state for sidebar sections
let experimentsCollapsed = false;
let containersCollapsed = false;

// Graph pan/zoom state
let gZoom = 1, gPanX = 0, gPanY = 0;
let gDragging = false, gDragStartX = 0, gDragStartY = 0, gPanStartX = 0, gPanStartY = 0;

function graphUpdateTransform() {
  const inner = document.getElementById('graph-inner');
  if (inner) inner.style.transform = `translate(${gPanX}px, ${gPanY}px) scale(${gZoom})`;
  const zl = document.getElementById('zoom-level');
  if (zl) zl.textContent = Math.round(gZoom * 100) + '%';
}
function graphZoom(factor) {
  const view = document.getElementById('graph-view');
  const cx = view.clientWidth / 2, cy = view.clientHeight / 2;
  gPanX = cx - factor * (cx - gPanX);
  gPanY = cy - factor * (cy - gPanY);
  gZoom = Math.max(0.05, Math.min(10, gZoom * factor));
  graphUpdateTransform();
}
function graphFit() {
  const view = document.getElementById('graph-view');
  const svg = document.getElementById('graph-inner')?.querySelector('svg');
  if (!svg) return;
  const svgW = parseFloat(svg.getAttribute('width') || svg.getBBox().width);
  const svgH = parseFloat(svg.getAttribute('height') || svg.getBBox().height);
  if (!svgW || !svgH) return;
  gZoom = Math.min(view.clientWidth / svgW, view.clientHeight / svgH) * 0.95;
  gPanX = (view.clientWidth - svgW * gZoom) / 2;
  gPanY = (view.clientHeight - svgH * gZoom) / 2;
  graphUpdateTransform();
}
function graphReset() { gZoom = 1; gPanX = 0; gPanY = 0; graphUpdateTransform(); }

document.addEventListener('DOMContentLoaded', () => {
  const view = document.getElementById('graph-view');
  view.addEventListener('wheel', (e) => {
    if (currentTab !== 'graph') return;
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.1 : 0.91;
    const rect = view.getBoundingClientRect();
    gPanX = (e.clientX - rect.left) - factor * ((e.clientX - rect.left) - gPanX);
    gPanY = (e.clientY - rect.top) - factor * ((e.clientY - rect.top) - gPanY);
    gZoom = Math.max(0.05, Math.min(10, gZoom * factor));
    graphUpdateTransform();
  }, { passive: false });
  view.addEventListener('mousedown', (e) => {
    if (e.button !== 0 || currentTab !== 'graph') return;
    gDragging = true; gDragStartX = e.clientX; gDragStartY = e.clientY;
    gPanStartX = gPanX; gPanStartY = gPanY; view.classList.add('dragging');
  });
  document.addEventListener('mousemove', (e) => {
    if (!gDragging) return;
    gPanX = gPanStartX + (e.clientX - gDragStartX);
    gPanY = gPanStartY + (e.clientY - gDragStartY);
    graphUpdateTransform();
  });
  document.addEventListener('mouseup', () => { gDragging = false; document.getElementById('graph-view').classList.remove('dragging'); });
});

async function fetchJSON(url) { return (await fetch(url)).json(); }

const MAX_PROCS = 1500;

async function refresh() {
  try {
    const [containers, expData] = await Promise.all([
      fetchJSON('/containers'),
      fetchJSON('/experiments'),
    ]);
    const experiments = expData.experiments || [];
    const html = document.getElementById('sidebar-content');
    let out = '';

    // Experiments section
    if (experiments.length > 0) {
      out += `<div class="section-header" onclick="toggleSection('experiments')">
        Experiments (${experiments.length})
        <span class="arrow${experimentsCollapsed ? ' collapsed' : ''}" id="exp-arrow">&#9660;</span>
      </div>`;
      if (!experimentsCollapsed) {
        for (const exp of experiments) {
          const active = selectionType === 'experiment' && selectedId === exp.id;
          out += `<div class="exp-item${active ? ' active' : ''}" onclick="selectExperiment('${exp.id}')">
            <div class="eid">${exp.name || exp.id}</div>
            <div class="stats">${exp.containers.length} containers</div>
          </div>`;
        }
      }
    }

    // Containers section (ungrouped containers)
    const expContainers = new Set(experiments.flatMap(e => e.containers));
    const ungrouped = containers.filter(c => !expContainers.has(c.container_id) && c.completed_actions > 0 && c.processes <= MAX_PROCS);
    const skippedZero = containers.filter(c => c.completed_actions === 0).length;
    const skippedLarge = containers.filter(c => c.completed_actions > 0 && c.processes > MAX_PROCS).length;

    if (ungrouped.length > 0) {
      out += `<div class="section-header" onclick="toggleSection('containers')">
        Containers (${ungrouped.length})
        <span class="arrow${containersCollapsed ? ' collapsed' : ''}" id="ctr-arrow">&#9660;</span>
      </div>`;
      if (!containersCollapsed) {
        ungrouped.sort((a, b) => b.processes - a.processes);
        for (const c of ungrouped) {
          const active = selectionType === 'container' && selectedId === c.container_id;
          out += `<div class="container-item${active ? ' active' : ''}" onclick="selectContainer('${c.container_id}')">
            <div class="cid">${c.container_id}</div>
            <div class="stats">${c.processes} procs, ${c.completed_actions} actions</div>
          </div>`;
        }
      }
    }

    html.innerHTML = out;

    const note = document.getElementById('skipped-note');
    const parts = [];
    if (skippedZero > 0) parts.push(`${skippedZero} with 0 actions`);
    if (skippedLarge > 0) parts.push(`${skippedLarge} with >${MAX_PROCS} procs`);
    note.textContent = parts.length > 0 ? `Hidden: ${parts.join(', ')}` : '';
    note.classList.toggle('hidden', parts.length === 0);

    document.getElementById('status-text').textContent =
      `${experiments.length} experiments, ${containers.length} containers | ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    document.getElementById('status-text').textContent = 'Error: ' + e.message;
  }
}

function toggleSection(section) {
  if (section === 'experiments') experimentsCollapsed = !experimentsCollapsed;
  if (section === 'containers') containersCollapsed = !containersCollapsed;
  refresh();
}

async function selectExperiment(id) {
  selectionType = 'experiment';
  selectedId = id;
  selectedAction = null;
  document.getElementById('no-selection').classList.add('hidden');
  await refresh();
  await loadActionList();
  await loadTab();
}

async function selectContainer(id) {
  selectionType = 'container';
  selectedId = id;
  selectedAction = null;
  document.getElementById('no-selection').classList.add('hidden');
  await refresh();
  await loadActionList();
  await loadTab();
}

async function loadActionList() {
  if (!selectedId) return;
  const actionList = document.getElementById('action-list');
  try {
    let actions = [];
    if (selectionType === 'experiment') {
      // Collect actions from all containers in the experiment
      const expData = await fetchJSON('/experiments');
      const exp = (expData.experiments || []).find(e => e.id === selectedId);
      if (exp) {
        const actionMap = new Map(); // action_id -> {command, containers}
        for (const cid of exp.containers) {
          try {
            const data = await fetchJSON(`/containers/${cid}/actions`);
            for (const a of (data.completed || [])) {
              if (!actionMap.has(a.action_id)) {
                actionMap.set(a.action_id, { action_id: a.action_id, command: a.command, count: 1 });
              } else {
                actionMap.get(a.action_id).count++;
              }
            }
          } catch (_) {}
        }
        actions = [...actionMap.values()].sort((a, b) => a.action_id - b.action_id);
      }
    } else {
      const data = await fetchJSON(`/containers/${selectedId}/actions`);
      actions = (data.completed || []).map(a => ({ ...a, count: 1 }));
    }

    let html = `<div class="action-item${selectedAction === null ? ' active' : ''}" onclick="selectAction(null)">
      <div class="action-id">${selectionType === 'experiment' ? 'Overview' : 'Snapshot'}</div>
      <div class="action-cmd">${selectionType === 'experiment' ? 'All activity' : 'Full receipt'}</div>
    </div>`;
    for (const a of actions) {
      const short = a.command.length > 35 ? a.command.slice(0,35)+'...' : a.command;
      const countLabel = a.count > 1 ? ` (${a.count} containers)` : '';
      html += `<div class="action-item${selectedAction === a.action_id ? ' active' : ''}" onclick="selectAction(${a.action_id})">
        <div class="action-id">Action ${a.action_id}${countLabel}</div>
        <div class="action-cmd">${short}</div>
      </div>`;
    }
    actionList.innerHTML = html;
  } catch (e) {
    actionList.innerHTML = '';
  }
}

function selectAction(actionId) {
  selectedAction = actionId;
  document.querySelectorAll('.action-item').forEach((el, i) => {
    el.classList.toggle('active', actionId === null ? i === 0 :
      el.querySelector('.action-id')?.textContent?.startsWith(`Action ${actionId}`));
  });
  loadTab();
}

function updateActionSidebarVisibility() {
  const actionSidebar = document.getElementById('action-sidebar');
  if (currentTab === 'graph' || !selectedId) {
    actionSidebar.classList.add('hidden');
  } else {
    actionSidebar.classList.remove('hidden');
  }
}

async function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('#tabs .tab').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tab);
  });
  updateActionSidebarVisibility();
  await loadTab();
}

async function loadTab() {
  if (!selectedId) return;
  const receiptView = document.getElementById('receipt-view');
  const graphView = document.getElementById('graph-view');
  updateActionSidebarVisibility();

  if (currentTab === 'graph') {
    graphView.classList.remove('hidden');
    receiptView.classList.add('hidden');
    const loading = document.getElementById('graph-loading');
    loading.classList.remove('hidden');
    try {
      let url;
      if (selectionType === 'experiment') {
        url = `/experiments/${selectedId}/graph`;
      } else {
        url = `/containers/${selectedId}/graph`;
      }
      const r = await fetch(url);
      const dot = await r.text();
      if (typeof Viz === 'undefined') {
        document.getElementById('graph-inner').innerHTML = '<div style="color:#888;padding:20px">Loading renderer...</div>';
      } else {
        await new Promise(resolve => requestAnimationFrame(() => setTimeout(resolve, 0)));
        const svg = await Viz.instance().then(viz => viz.renderSVGElement(dot));
        const inner = document.getElementById('graph-inner');
        inner.innerHTML = '';
        inner.appendChild(svg);
        svg.style.width = 'auto';
        svg.style.height = 'auto';
      }
      loading.classList.add('hidden');
      setTimeout(graphFit, 50);
    } catch (e) {
      loading.classList.add('hidden');
      document.getElementById('graph-inner').innerHTML = '<div style="color:#c00;padding:20px">Error: ' + e.message + '</div>';
    }
  } else {
    receiptView.classList.remove('hidden');
    graphView.classList.add('hidden');
    try {
      let data;
      if (selectionType === 'experiment') {
        if (selectedAction === null) {
          data = await fetchJSON(`/experiments/${selectedId}/receipt`);
        } else {
          data = await fetchJSON(`/experiments/${selectedId}/actions/${selectedAction}/receipt`);
        }
      } else {
        if (selectedAction === null) {
          data = await fetchJSON(`/containers/${selectedId}/receipt`);
        } else {
          data = await fetchJSON(`/containers/${selectedId}/actions/${selectedAction}/receipt`);
        }
      }
      receiptView.textContent = data.receipt || data.error || 'No data';
    } catch (e) {
      receiptView.textContent = 'Error: ' + e.message;
    }
  }
}

function startAutoRefresh() {
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  autoRefreshTimer = setInterval(async () => {
    if (!document.getElementById('auto-refresh-toggle').checked) return;
    await refresh();
    if (selectedId) {
      await loadActionList();
      await loadTab();
    }
  }, 5000);
}

refresh();
startAutoRefresh();
</script>
<script src="/viz.js"></script>
</body>
</html>
